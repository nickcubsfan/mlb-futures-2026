<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 MLB Futures Dashboard</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #181818;
    --bg3: #222222;
    --bg4: #2a2a2a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --text2: #9a9690;
    --text3: #5a5754;
    --amber: #e8a928;
    --amber-bg: rgba(232,169,40,0.1);
    --amber-dim: rgba(232,169,40,0.5);
    --green: #4caf7a;
    --green-bg: rgba(76,175,122,0.1);
    --red: #e05252;
    --red-bg: rgba(224,82,82,0.1);
    --blue: #4f9cf0;
    --blue-bg: rgba(79,156,240,0.1);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overscroll-behavior: contain; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; overscroll-behavior-y: contain; overflow-x: hidden; }

  /* TOP NAV */
  .topnav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 0; position: sticky; top: 0; z-index: 50; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .topnav::-webkit-scrollbar { display: none; }
  .topnav .logo { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.02em; padding: 16px 0; margin-right: 32px; white-space: nowrap; }
  .topnav .logo span { color: var(--amber); }
  .nav-tabs { display: flex; gap: 0; }
  .nav-tab { font-size: 13px; padding: 18px 16px; border: none; background: none; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; white-space: nowrap; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.on { color: var(--amber); border-bottom-color: var(--amber); font-weight: 500; }

  /* LAYOUT */
  .page { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .page.on { display: block; }

  /* METRICS ROW */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-bottom: 20px; }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 600; color: var(--text); }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.amber { color: var(--amber); }

  /* CONTROLS */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .controls input, .controls select {
    font-size: 13px; padding: 7px 11px; height: 34px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg2); color: var(--text);
    font-family: var(--font); outline: none;
  }
  .controls input { width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--amber); }
  .add-btn {
    margin-left: auto; font-size: 13px; padding: 7px 16px; height: 34px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg2); color: var(--amber);
    cursor: pointer; font-family: var(--font); font-weight: 500; white-space: nowrap;
    transition: background .15s;
  }
  .add-btn:hover { background: var(--amber-bg); }

  /* TABLE */
  .tbl-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
  thead th {
    text-align: left; padding: 9px 13px; font-size: 11px; font-weight: 500;
    color: var(--text3); background: var(--bg2); border-bottom: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none; text-transform: uppercase; letter-spacing: .05em;
  }
  thead th:hover { color: var(--text2); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg3); }
  tbody td { padding: 8px 13px; }

  .market-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: var(--blue-bg); color: var(--blue); white-space: nowrap; font-weight: 500;
  }
  .odds { font-weight: 600; font-family: var(--mono); font-size: 12px; color: var(--amber); }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .win-amt { font-weight: 600; font-family: var(--mono); font-size: 12px; color: var(--green); }
  .status-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 99px; border: none;
    cursor: pointer; font-weight: 600; font-family: var(--font); transition: opacity .15s;
  }
  .status-btn:hover { opacity: 0.8; }
  .status-pending { background: rgba(154,150,144,0.15); color: var(--text2); }
  .status-win { background: var(--green-bg); color: var(--green); }
  .status-loss { background: var(--red-bg); color: var(--red); }
  .del-btn {
    font-size: 12px; color: var(--text3); background: none; border: none;
    cursor: pointer; padding: 3px 6px; border-radius: 4px; transition: color .1s;
  }
  .del-btn:hover { color: var(--red); }
  .no-results { padding: 2.5rem; text-align: center; color: var(--text3); font-size: 13px; }

  /* MODAL */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 460px; margin: 0 16px;
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 18px; color: var(--text); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
  .form-group input, .form-group select {
    font-size: 13px; padding: 8px 11px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-family: var(--font); outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--amber); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .modal-actions button {
    font-size: 13px; padding: 8px 18px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg3); color: var(--text2);
    cursor: pointer; font-family: var(--font); transition: background .15s;
  }
  .modal-actions button:hover { background: var(--bg4); }
  .modal-actions .save-btn { background: var(--amber); color: #0f0f0f; border-color: var(--amber); font-weight: 600; }
  .modal-actions .save-btn:hover { background: #f0b930; }

  /* STATS PAGE */
  .stats-hdr { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .stats-hdr h2 { font-size: 18px; font-weight: 600; }
  .stats-hdr .sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .rfbtn {
    font-size: 13px; padding: 7px 16px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg2); color: var(--amber);
    cursor: pointer; font-family: var(--font); font-weight: 500; white-space: nowrap;
    transition: background .15s;
  }
  .rfbtn:hover { background: var(--amber-bg); }
  .rfbtn:disabled { opacity: 0.4; pointer-events: none; }

  .stat-tabs-wrap { overflow-x: auto; margin-bottom: 16px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-width: none; }
  .stat-tabs-wrap::-webkit-scrollbar { display: none; }
  .stat-tabs { display: flex; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .stb {
    font-size: 12px; padding: 9px 14px; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; color: var(--text3); background: none; font-family: var(--font);
    transition: color .15s; margin-bottom: -1px;
  }
  .stb:hover { color: var(--text2); }
  .stb.on { color: var(--amber); border-bottom-color: var(--amber); font-weight: 500; }

  .picks-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 26px; }
  .chip {
    font-size: 11px; padding: 4px 10px; border-radius: 99px;
    background: var(--amber-bg); color: var(--amber); font-weight: 500; border: 1px solid var(--amber-dim);
  }
  .chip.nr { background: var(--bg3); color: var(--text3); border-color: var(--border); font-weight: 400; }
  .chip.done { background: var(--green-bg); color: var(--green); border-color: rgba(76,175,122,0.4); }

  .lb-row-mine { background: rgba(232,169,40,0.04); }
  .lb-row-mine:hover { background: rgba(232,169,40,0.08) !important; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-right: 7px; vertical-align: middle; position: relative; top: -1px; }
  .rank { font-size: 12px; color: var(--text3); width: 36px; font-family: var(--mono); }
  .lb-val { font-family: var(--mono); font-weight: 600; color: var(--text); text-align: right; }
  .ms-tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: var(--red-bg); color: var(--red); margin-left: 6px; font-weight: 500;
  }
  .ms-tag.done { background: var(--green-bg); color: var(--green); }
  .mkt-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 99px;
    background: var(--blue-bg); color: var(--blue); margin-left: 5px; white-space: nowrap;
  }
  .sec-lbl {
    font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .08em;
    text-transform: uppercase; margin: 20px 0 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .sec-lbl:first-child { margin-top: 0; }
  .state-msg { padding: 2.5rem; text-align: center; color: var(--text3); font-size: 13px; }
  .err-msg { color: var(--red); font-size: 12px; margin-top: 4px; }

  /* ── SCORE TICKER ── */
  #score-ticker-wrap {
    position: relative;
    background: var(--bg2);
    border-bottom: 1px solid var(--border2);
    display: flex;
    align-items: center;
    overflow: hidden;
    height: 52px;
    flex-shrink: 0;
  }
  #score-ticker {
    flex: 1;
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%);
  }
  .ticker-inner {
    display: flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
    animation: ticker-scroll 25s linear infinite;
    will-change: transform;
  }
  .ticker-inner.paused { animation-play-state: paused; }
  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-game {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    border-right: 1px solid var(--border);
    height: 52px;
    cursor: default;
    flex-shrink: 0;
  }
  .ticker-game:hover { background: rgba(255,255,255,0.03); }
  .ticker-team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 44px;
  }
  .ticker-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .ticker-abbr {
    font-size: 10px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .ticker-score-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 36px;
  }
  .ticker-scores {
    display: flex;
    gap: 6px;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .ticker-scores .winner { color: var(--amber); }
  .ticker-status {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .05em;
    text-align: center;
  }
  .ticker-status.live {
    color: var(--green);
    font-weight: 600;
  }
  .ticker-dash {
    font-size: 13px;
    color: var(--text3);
    font-family: var(--mono);
  }
  .ticker-controls {
    display: flex;
    gap: 4px;
    padding: 0 10px;
    flex-shrink: 0;
    z-index: 2;
  }
  .ticker-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text3);
    border-radius: 4px;
    width: 24px;
    height: 24px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color .15s;
  }
  .ticker-btn:hover { color: var(--text); border-color: var(--amber); }
  .ticker-loading { font-size: 12px; color: var(--text3); padding: 0 20px; }
  @media(max-width:640px){
    #score-ticker-wrap { height: 46px; }
    .ticker-game { padding: 0 14px; gap: 7px; height: 46px; }
    .ticker-logo { width: 20px; height: 20px; }
    .ticker-scores { font-size: 12px; }
    .ticker-abbr { font-size: 9px; }
    .ticker-inner { animation-duration: 5s !important; }
  }

  /* Player bet drawer */
  .lb-drawer { background: var(--bg3); border-top: 0.5px solid var(--border2); }
  .lb-drawer td { padding: 0; }
  .lb-drawer-inner { padding: 8px 13px 10px 36px; display: flex; flex-direction: column; gap: 4px; }
  .lb-bet-row { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .lb-bet-book { color: var(--text2); background: var(--bg4); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .lb-bet-odds { color: var(--amber); font-family: var(--mono); font-weight: 600; }
  .lb-bet-stake { color: var(--text3); font-family: var(--mono); }
  .lb-bet-win  { color: var(--green); font-family: var(--mono); font-weight: 600; }
  .lb-bet-status { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; }
  .lb-clickable { cursor: pointer; }
  .lb-clickable:hover td { background: rgba(232,169,40,0.05) !important; }
  .lb-expand-icon { font-size: 10px; color: var(--text3); margin-left: 4px; display: inline-block; transition: transform .15s; }
  .lb-expand-icon.open { transform: rotate(90deg); }

  /* RESPONSIVE */
  @media(max-width:640px){
    .page { padding: 16px; }
    .topnav { padding: 0 16px; }
    .controls input { width: 140px; }
    .col-book, .col-stake { display: none; }
  }

  /* ── DASHBOARD ── */
  .db-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .db-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; }
  .db-card.span2  { grid-column: span 2; }
  .db-card.span3  { grid-column: span 3; }
  .db-card.span4  { grid-column: span 4; }
  .db-card.span6  { grid-column: span 6; }
  .db-card.span8  { grid-column: span 8; }
  .db-card.span12 { grid-column: span 12; }
  .db-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 10px; }
  .db-big { font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .db-big.amber { color: var(--amber); }
  .db-big.green { color: var(--green); }
  .db-big.red   { color: var(--red); }
  .db-sub { font-size: 12px; color: var(--text3); margin-top: 6px; }
  .db-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 14px; }
  .db-hero-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; }
  .db-hero-card.accent { border-color: var(--amber); background: linear-gradient(135deg, rgba(232,169,40,0.07) 0%, var(--bg2) 60%); }
  .chart-wrap { position: relative; width: 100%; }
  .db-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .db-list li { display: flex; align-items: center; justify-content: space-between; font-size: 13px; gap: 8px; }
  .db-list li .name { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .db-list li .val  { font-family: var(--mono); font-size: 12px; color: var(--amber); font-weight: 600; flex-shrink: 0; }
  .db-list li .sub2 { font-size: 11px; color: var(--text3); flex-shrink: 0; }
  .db-bar-row { display: flex; flex-direction: column; gap: 9px; }
  .db-bar-scroll { display: flex; flex-direction: column; gap: 9px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .db-bar-scroll::-webkit-scrollbar { width: 3px; }
  .db-bar-scroll::-webkit-scrollbar-track { background: transparent; }
  .db-bar-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  .db-bar-item { display: flex; flex-direction: column; gap: 4px; }
  .db-bar-meta { display: flex; justify-content: space-between; font-size: 12px; }
  .db-bar-meta .lbl { color: var(--text2); }
  .db-bar-meta .amt { color: var(--amber); font-family: var(--mono); font-weight: 600; }
  .db-bar-track { height: 5px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .db-bar-fill  { height: 100%; border-radius: 99px; background: var(--amber); transition: width .6s ease; }
  .db-bar-fill.green { background: var(--green); }
  .db-bar-fill.blue  { background: var(--blue); }
  .status-row { display: flex; gap: 18px; margin-top: 14px; }
  .status-pill { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .status-pill .pill-num { font-size: 28px; font-weight: 700; line-height: 1; }
  .status-pill .pill-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); }
  .pill-num.amber { color: var(--amber); }
  .pill-num.green { color: var(--green); }
  .pill-num.red   { color: var(--red); }
  .db-divider { width: 1px; background: var(--border); align-self: stretch; }
  .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .odds-item { background: var(--bg3); border-radius: var(--radius); padding: 10px 12px; }
  .odds-item .o-player { font-size: 12px; color: var(--text); font-weight: 500; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .odds-item .o-market { font-size: 10px; color: var(--text3); margin-bottom: 6px; }
  .odds-item .o-win { font-size: 15px; font-family: var(--mono); font-weight: 700; color: var(--green); }
  .odds-item .o-odds { font-size: 11px; color: var(--amber); margin-left: 6px; }
  .db-section-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .db-badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: var(--amber-bg); color: var(--amber); font-weight: 600; }
  .book-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  @media(max-width:900px){
    .db-card.span8 { grid-column: span 12; }
    .db-card.span4 { grid-column: span 12; }
    .db-card.span6 { grid-column: span 12; }
    .db-card.span3 { grid-column: span 6; }
  }
  @media(max-width:540px){
    .db-card.span3 { grid-column: span 12; }
    .odds-grid { grid-template-columns: 1fr; }
  }
  @media(max-width:640px){
    table { min-width: 0; font-size: 12px; }
    thead th { padding: 7px 8px; font-size: 10px; }
    tbody td { padding: 6px 8px; }
    /* Rank col */
    .rank { width: 24px !important; font-size: 11px; }
    /* Team col */
    td[style*="width:46px"] { width: 32px !important; font-size: 10px; }
    /* Stat val col */
    .lb-val { width: 44px !important; font-size: 12px; }
    /* Hide expand icon on very small screens — drawer still works on tap */
    td[style*="display:flex"] { padding: 6px 8px !important; gap: 4px !important; }
    /* Futures table */
    .col-odds { min-width: 0; }
    /* Daily cards grid */
    .daily-card { padding: 8px 10px; }
  }


  /* injury + daily summary */
  .inj-tag { font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(224,82,82,0.15); color:var(--red); font-weight:600; margin-left:6px; }
  .daily-card { background:var(--bg3); border-radius:var(--radius); padding:10px 12px; display:flex; flex-direction:column; gap:4px; border-left:3px solid var(--border2); }
  .daily-card.good  { border-left-color:var(--green); }
  .daily-card.bad   { border-left-color:var(--red); }
  .daily-card.ok    { border-left-color:var(--amber); }

// ── persistent state in localStorage ──
const STORAGE_KEY = 'mlb2026_bets_v4';
function loadBets() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; }
}
function saveBets() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(bets)); } catch(e){}
}

let bets = loadBets() || RAW_BETS.map((b,i)=>({...b,id:i}));
let nextId = bets.length ? Math.max(...bets.map(b=>b.id))+1 : 0;
let sortCol = 'market', sortDir = 1;

function fmt(n){ return '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function getFiltered(){
  const mob = window.innerWidth <= 640;
  const q = (mob ? document.getElementById('mob-search') : document.getElementById('search'))?.value?.toLowerCase() || document.getElementById('search')?.value?.toLowerCase() || '';
  const mkt = (mob ? document.getElementById('mob-flt-market') : document.getElementById('flt-market'))?.value || document.getElementById('flt-market')?.value || '';
  const bk = (mob ? document.getElementById('mob-flt-book') : document.getElementById('flt-book'))?.value || document.getElementById('flt-book')?.value || '';
  const st = (mob ? document.getElementById('mob-flt-status') : document.getElementById('flt-status'))?.value || document.getElementById('flt-status')?.value || '';
  return bets.filter(b=>{
    if(q && !b.player.toLowerCase().includes(q) && !b.market.toLowerCase().includes(q)) return false;
    if(mkt && b.market !== mkt) return false;
    if(bk && b.book !== bk) return false;
    if(st && b.status !== st) return false;
    return true;
  });
}

function getSorted(arr){
  return [...arr].sort((a,b)=>{
    let av=a[sortCol], bv=b[sortCol];
    if(typeof av==='string') return av.localeCompare(bv)*sortDir;
    return (av-bv)*sortDir;
  });
}

function sortBy(col){
  if(sortCol===col) sortDir*=-1; else {sortCol=col;sortDir=1;}
  renderFutures();
}

function cycleStatus(id){
  const b=bets.find(x=>x.id===id); if(!b) return;
  b.status = b.status==='pending'?'win':b.status==='win'?'loss':'pending';
  saveBets(); renderFutures();
}
function deleteBet(id){
  bets=bets.filter(b=>b.id!==id); saveBets(); renderFutures();
}

function populateFilters(){
  const markets=[...new Set(bets.map(b=>b.market))].sort();
  const books=[...new Set(bets.map(b=>b.book))].sort();
  const opts=['flt-market','mob-flt-market'];

function updateMetrics(vis){
  const staked=vis.reduce((a,b)=>a+b.stake,0);
  const maxWin=vis.reduce((a,b)=>a+b.toWin,0);
  const wins=vis.filter(b=>b.status==='win').length;
  const losses=vis.filter(b=>b.status==='loss').length;
  const pending=vis.filter(b=>b.status==='pending').length;
  const wonAmt=vis.filter(b=>b.status==='win').reduce((a,b)=>a+b.toWin,0);
  const lostAmt=vis.filter(b=>b.status==='loss').reduce((a,b)=>a+b.stake,0);
  const pnl=wonAmt-lostAmt;
  document.getElementById('m-staked').textContent=fmt(staked);
  document.getElementById('m-win').textContent=fmt(maxWin);
  document.getElementById('m-pending').textContent=pending;
  document.getElementById('m-wins').textContent=wins;
  document.getElementById('m-losses').textContent=losses;
  const el=document.getElementById('m-pnl');
  el.textContent=(pnl>=0?'+':'')+fmt(pnl);
  el.className='metric-value '+(pnl>0?'green':pnl<0?'red':'');
}

function normName(s){
  let n=(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.']/g,'').replace(/\b(jr|sr|ii|iii)\b/g,'').replace(/\s+/g,' ').trim();
  return ALIASES[n]||n;
}

// ── Convert American odds string to implied probability ──
function oddsToImplied(odds) {
  const n = parseInt(odds);
  if (isNaN(n)) return 0.5;
  return n > 0 ? 100/(n+100) : Math.abs(n)/(Math.abs(n)+100);
}
function impliedToOdds(p) {
  if (p <= 0 || p >= 1) return '+100';
  if (p > 0.5) { const x = Math.round(p/(1-p)*100); return '-'+x; }
  const x = Math.round((1-p)/p*100); return '+'+x;
}
function avgOdds(oddsArr) {
  const valid = oddsArr.filter(o => o && o !== '—');
  if (!valid.length) return '—';
  const avg = valid.reduce((a,o) => a+oddsToImplied(o), 0)/valid.length;
  return impliedToOdds(avg);
}

async function loadStats(){
  const btn=document.getElementById('rfbtn');
  const lbl=document.getElementById('upd-lbl');
  btn.disabled=true; btn.textContent='↻ Loading…';
  lbl.textContent='Fetching live MLB stats…';
  const statCats=STAT_CATS.filter(c=>c.sl);
  let failed=0;
  apiData={};
  playerStatsCache={};

  // 1. Load leaderboards
  await Promise.all(statCats.map(async cat=>{
    try{
      const base='https://bdfed.stitch.mlbinfra.com/bdfed/stats/player';
      const params='?env=prod&season=2026&sportId=1&stats=season&group='+cat.group+'&gameType=R&limit=50&offset=0&sortStat='+cat.sortStat+'&order=desc';
      const res=await fetch(base+params);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j=await res.json();
      apiData[cat.id]=(j.stats||[]).map((l,i)=>({
        rank:i+1,
        name:l.playerFullName||(l.playerFirstName+' '+l.playerLastName)||'?',
        team:l.teamAbbrev||l.teamName||'—',
        value:+(l[cat.sortStat]||0)
      }));
    }catch(e){ failed++; apiData[cat.id]=[]; }
  }));

  // 2. Fetch NR player stats individually
  const nrFetches = [];
  for (const cat of statCats) {
    const picks = uniqPicks(picksFor(cat.id));
    for (const p of picks) {
      if (!getRanking(cat.id, p.player)) {
        nrFetches.push({cat, player:p.player});
      }
    }
  }
  if (nrFetches.length) {
    // Get all active players once (for ID lookup)
    let allPlayers = [];
    try {
      const pr = await fetch('https://statsapi.mlb.com/api/v1/sports/1/players?season=2026&gameType=R');
      if (pr.ok) { const pj = await pr.json(); allPlayers = pj.people||[]; }
    } catch(e){}

    await Promise.all(nrFetches.map(async ({cat, player})=>{
      try {
        const found = allPlayers.find(p2 => nameMatch(p2.fullName, player));
        if (!found) return;
        const group = cat.group;
        const sr = await fetch('https://statsapi.mlb.com/api/v1/people/'+found.id+'/stats?stats=season&season=2026&group='+group+'&gameType=R&sportId=1');
        if (!sr.ok) return;
        const sj = await sr.json();
        const splits = (sj.stats||[])[0]?.splits||[];
        if (!splits.length) return;
        const stat = splits[0].stat;
        const teamAbbr = splits[0].team?.abbreviation || '—';
        const val = stat[cat.sortStat] ?? stat['strikeOuts'] ?? 0;
        if (!playerStatsCache[cat.id]) playerStatsCache[cat.id]={};
        playerStatsCache[cat.id][normName(player)] = {value:+val, team:teamAbbr};
      } catch(e){}
    }));
  }

  // 3. Fetch standings (best/worst records)
  try {
    const sr = await fetch('https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026&standingsType=regularSeason&sportId=1');
    if (sr.ok) {
      const sj = await sr.json();
      let all = [];
      for (const rec of (sj.records||[])) {
        for (const t of (rec.teamRecords||[])) {
          const tName = t.team?.name||'?';
          const ABBR_FROM_NAME = {
            'Arizona Diamondbacks':'AZ','Diamondbacks':'AZ',
            'Atlanta Braves':'ATL','Braves':'ATL',
            'Baltimore Orioles':'BAL','Orioles':'BAL',
            'Boston Red Sox':'BOS','Red Sox':'BOS',
            'Chicago Cubs':'CHC','Cubs':'CHC',
            'Chicago White Sox':'CWS','White Sox':'CWS',
            'Cincinnati Reds':'CIN','Reds':'CIN',
            'Cleveland Guardians':'CLE','Guardians':'CLE',
            'Colorado Rockies':'COL','Rockies':'COL',
            'Detroit Tigers':'DET','Tigers':'DET',
            'Houston Astros':'HOU','Astros':'HOU',
            'Kansas City Royals':'KC','Royals':'KC',
            'Los Angeles Angels':'LAA','Angels':'LAA','LA Angels':'LAA',
            'Los Angeles Dodgers':'LAD','Dodgers':'LAD','LA Dodgers':'LAD',
            'Miami Marlins':'MIA','Marlins':'MIA',
            'Milwaukee Brewers':'MIL','Brewers':'MIL',
            'Minnesota Twins':'MIN','Twins':'MIN',
            'New York Mets':'NYM','Mets':'NYM',
            'New York Yankees':'NYY','Yankees':'NYY',
            'Oakland Athletics':'ATH','Athletics':'ATH',
            'Philadelphia Phillies':'PHI','Phillies':'PHI',
            'Pittsburgh Pirates':'PIT','Pirates':'PIT',
            'San Diego Padres':'SD','Padres':'SD',
            'San Francisco Giants':'SF','Giants':'SF',
            'Seattle Mariners':'SEA','Mariners':'SEA',
            'St. Louis Cardinals':'STL','Cardinals':'STL',
            'Tampa Bay Rays':'TB','Rays':'TB',
            'Texas Rangers':'TEX','Rangers':'TEX',
            'Toronto Blue Jays':'TOR','Blue Jays':'TOR',
            'Washington Nationals':'WSH','Nationals':'WSH'
          };
          const rawAbbr = t.team?.abbreviation||t.team?.abbrev||'';
          const tAbbrev = (rawAbbr&&rawAbbr!=='?') ? rawAbbr : (ABBR_FROM_NAME[tName]||'');
          all.push({
            name: tName,
            abbrev: tAbbrev,
            abbrev2: t.team?.fileCode?.toUpperCase()||'',
            w: t.wins, l: t.losses,
            pct: t.winningPercentage,
            gb: t.gamesBack,
            div: rec.division?.nameShort||rec.division?.name||''
          });
        }
      }
      all.sort((a,b)=>parseFloat(b.pct)-parseFloat(a.pct));
      standingsData.best = all.slice(0,5);
      standingsData.worst = [...all].reverse().slice(0,5);
    }
  } catch(e){}

  // 4. Fetch IL transactions for injury tags
  try {
    const today = new Date().toISOString().slice(0,10);
    const ir = await fetch('https://statsapi.mlb.com/api/v1/transactions?leagueId=103,104&sportId=1&startDate=2026-03-01&endDate='+today+'&transactionTypes=IL&limit=500');
    if (ir.ok) {
      const ij = await ir.json();
      injuredPlayers = new Set();
      for (const t of (ij.transactions||[])) {
        const name = t.person?.fullName;
        // only tag if not also transferred off IL more recently
        if (name && t.typeCode && t.typeCode.includes('IL')) injuredPlayers.add(normName(name));
      }
      // Also remove players transferred back
      for (const t of (ij.transactions||[])) {
        const name = t.person?.fullName;
        if (name && t.typeCode && (t.typeCode==='TA'||t.description?.toLowerCase().includes('activated'))) {

  // 5. Fetch recent game logs for my players

  } else {
    lbl.textContent='Live · Updated '+t;
  }
  btn.disabled=false; btn.textContent='↻ Refresh';
  renderStats();
  renderDashboard(); // refresh dashboard with new injury/daily data
}

function picksFor(cat){return MY_PICKS.filter(p=>p.cat===cat);}
function uniqPicks(arr){const s=new Set(),r=[];for(const p of arr){if(!s.has(p.player)){s.add(p.player);r.push(p);}}return r;}
function getRanking(cat,name){return (apiData[cat]||[]).find(l=>nameMatch(l.name,name))||null;}
function getNRStat(catId, name){ return (playerStatsCache[catId]||{})[normName(name)]||null; }
function isInjured(name){ return injuredPlayers.has(normName(name)); }

function toggleBetDrawer(rowId, name){
  const existing = document.querySelectorAll('.lb-drawer');
  const wasThisOne = existing.length && existing[0].dataset.for === rowId;
  existing.forEach(d=>d.remove());
  document.querySelectorAll('.lb-expand-icon.open').forEach(i=>i.classList.remove('open'));
  if(wasThisOne) return;

  const row = document.getElementById(rowId);
  if(!row) return;
  const icon = row.querySelector('.lb-expand-icon');
  if(icon) icon.classList.add('open');

  const playerBets = bets.filter(b=>nameMatch(b.player,name));
  if(!playerBets.length) return;

  const mkts = [...new Set(playerBets.map(b=>b.market))];
  let html = '';
  for(const mkt of mkts){
    const mktBets = playerBets.filter(b=>b.market===mkt);
    html += '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;margin-top:'+(html?'8px':'0')+';">'+mkt+'</div>';
    html += mktBets.map(b=>{
      const sc = b.status==='win'?'status-win':b.status==='loss'?'status-loss':'status-pending';
      return '<div class="lb-bet-row">'
        +'<span class="lb-bet-book">'+b.book+'</span>'
        +'<span class="lb-bet-odds">'+b.odds+'</span>'
        +'<span class="lb-bet-stake">'+fmt(b.stake)+'</span>'
        +'<span style="color:var(--text3);font-size:11px;">&#x2192;</span>'
        +'<span class="lb-bet-win">'+fmt(b.toWin)+'</span>'
        +'<button class="lb-bet-status '+sc+' status-btn lb-cycle-btn" data-betid="'+b.id+'" data-rowid="'+rowId+'" data-name="'+encodeURIComponent(name)+'" style="font-size:10px;padding:2px 7px;">'+b.status+'</button>'
      +'</div>';
    }).join('');
  }

  const numCols = row.cells.length;
  const drawer = document.createElement('tr');
  drawer.className = 'lb-drawer';
  drawer.dataset.for = rowId;
  drawer.innerHTML = '<td colspan="'+numCols+'"><div class="lb-drawer-inner">'+html+'</div></td>';
  row.parentNode.insertBefore(drawer, row.nextSibling);

  // Attach status cycle handlers using event listeners (avoids inline onclick quote hell)
  drawer.querySelectorAll('.lb-cycle-btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const id = +this.dataset.betid;
      const rid = this.dataset.rowid;
      const nm = decodeURIComponent(this.dataset.name);
      cycleStatus(id);
      toggleBetDrawer(rid, nm);
    });
  });
}

function renderStatContent(){
  const el=document.getElementById('stat-content');
  if(activeStatTab==='summary'){renderStatSummary(el);return;}
  if(activeStatTab==='records'){renderRecords(el);return;}
  const cat=STAT_CATS.find(c=>c.id===activeStatTab);
  const list=apiData[cat.id];
  const picks=uniqPicks(picksFor(cat.id));
  const loaded=!!list;

  const chips=picks.map(p=>{
    const r=getRanking(cat.id,p.player);
    const nr=getNRStat(cat.id,p.player);
    const inj=isInjured(p.player);
    const injTag=inj?' <span class="inj-tag">IL</span>':'';
    if(!loaded) return '<span class="chip nr">'+p.player+injTag+' — loading</span>';
    const val = r ? r.value : (nr ? nr.value : null);
    if(val===null) return '<span class="chip nr">'+p.player+injTag+' — NR</span>';
    const rank = r ? '#'+r.rank : 'NR';
    const need=p.milestone?p.milestone-val:null;
    const done=need!==null&&need<=0;
    let extra=need!==null?(done?' · '+p.milestone+' \u2713':' · needs '+need+' more'):'';
    return '<span class="chip'+(done?' done':(!r?' nr':''))+'">'+(r?'#'+r.rank:'NR')+' '+p.player+injTag+' — '+val+' '+cat.sl+extra+'</span>';
  }).join('');

  if(!loaded){
    el.innerHTML='<div class="picks-chips">'+chips+'</div><div class="state-msg">Press Refresh to load live data.</div>';return;
  }
  if(!list||!list.length){
    el.innerHTML='<div class="picks-chips">'+chips+'</div><div class="state-msg">No stats available yet — check back once games begin.</div>';return;
  }

  // Build leaderboard rows; append NR picks at bottom

    const lTeam=playerTeamAbbr(l.name)||l.team||'';

      toggleBetDrawer(this.dataset.rowid, decodeURIComponent(this.dataset.playername));
    });

}

// Summary sort state per category
const summarySortState = {};

function renderStatSummary(el) {
  const loaded = Object.keys(apiData).length > 0;
  let html = '';

  for (const cat of STAT_CATS.filter(c => c.sl)) {
    const picks = uniqPicks(picksFor(cat.id));
    if (!picks.length) continue;

    const s = summarySortState[cat.id] || {col:'stat', dir:-1};

    // Build data rows
    let rows = picks.map(p => {
      const r   = getRanking(cat.id, p.player);
      const nr  = getNRStat(cat.id, p.player);
      const inj = isInjured(p.player);
      const injTag   = inj ? '<span class="inj-tag">IL</span>' : '';
      const rankNum  = r ? r.rank : (nr ? 9999 : 99999);
      const val      = r ? r.value : (nr ? nr.value : null);
      const rankTxt  = loaded ? (r ? '#' + r.rank : (nr ? 'NR' : 'NR')) : '—';
      let statTxt    = loaded ? (val !== null ? val + ' ' + cat.sl : '—') : '—';
      let msHtml = '';
      if (p.milestone && val !== null) {
        const need = p.milestone - val;
        msHtml = '<span class="ms-tag' + (need <= 0 ? ' done' : '') + '" style="margin-left:6px">'
               + (need > 0 ? need + ' left' : cat.sl + ' \u2713') + '</span>';
      }
      return {player: p.player, injTag, rankNum, val: val !== null ? val : -1, rankTxt, statTxt, msHtml};
    });

    // Sort
    rows.sort((a, b) => {
      if (s.col === 'player') return a.player.localeCompare(b.player) * s.dir;
      if (s.col === 'rank')   return (a.rankNum - b.rankNum) * s.dir;
      return (a.val - b.val) * s.dir;
    });

    function arrow(col) {
      const active = s.col === col;
      const adir   = active ? s.dir : -1;
      return '<span style="margin-left:3px;opacity:' + (active ? '1' : '0.25') + ';font-size:10px;">'
           + (adir === -1 ? '\u2193' : '\u2191') + '</span>';
    }

    const tableRows = rows.map(r => {
      const pTeamAbbr = playerTeamAbbr(r.player)||'';
      const pLogo = pTeamAbbr ? teamLogoImgTag(pTeamAbbr,16) : '';
      return '<tr class="lb-row-mine">'
        + '<td style="display:flex;align-items:center;gap:6px;padding:7px 13px;">'+(pLogo||'<span style="width:16px;flex-shrink:0;"></span>')+r.player+r.injTag+'</td>'
        + '<td style="text-align:right;color:var(--text2);font-family:var(--mono);font-size:12px;width:60px">' + r.rankTxt + '</td>'
        + '<td style="text-align:right;font-family:var(--mono);font-size:12px;font-weight:600;width:90px">' + r.statTxt + r.msHtml + '</td>'
        + '</tr>';
    }).join('');

    const thStyle = 'cursor:pointer;user-select:none;text-align:left;padding:9px 13px;font-size:11px;font-weight:500;'
                  + 'color:var(--text3);background:var(--bg2);border-bottom:1px solid var(--border);'
                  + 'text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;';

    html += '<div class="sec-lbl">' + cat.label + '</div>'
          + '<div class="tbl-wrap" style="margin-bottom:14px"><table>'
          + '<thead><tr>'
          + '<th style="' + thStyle + '" data-cat="' + cat.id + '" data-col="player">Player' + arrow('player') + '</th>'
          + '<th style="' + thStyle + 'text-align:right;width:60px;" data-cat="' + cat.id + '" data-col="rank">Rank' + arrow('rank') + '</th>'
          + '<th style="' + thStyle + 'text-align:right;width:90px;" data-cat="' + cat.id + '" data-col="stat">' + cat.sl + arrow('stat') + '</th>'
          + '</tr></thead>'
          + '<tbody>' + tableRows + '</tbody>'
          + '</table></div>';
  }

  el.innerHTML = html || '<div class="state-msg">No quantifiable picks found.</div>';

  // Attach sort click handlers after DOM is set
  el.querySelectorAll('th[data-cat]').forEach(th => {
    th.addEventListener('click', () => {
      const catId = th.dataset.cat;
      const col   = th.dataset.col;
      const s     = summarySortState[catId] || {col:'stat', dir:-1};
      if (s.col === col) {
        summarySortState[catId] = {col, dir: s.dir * -1};
      } else {
        summarySortState[catId] = {col, dir: col === 'player' ? 1 : -1};
      }
      renderStatSummary(el);
    });
  });
}

async function fetchDailyData(){
  dailyData={};
  dailyError='';
  dailyDate='';
  dailyDebug='';
  const myUniqPlayers=[...new Set(MY_PICKS.map(p=>p.player))];

  // Check last 5 days to handle timezone edge cases
  const datesToTry=[];
  for(let i=1;i<=5;i++){
    const d=new Date();
    d.setDate(d.getDate()-i);
    // Use local date string to avoid UTC offset shifting the day
    const yr=d.getFullYear();
    const mo=String(d.getMonth()+1).padStart(2,'0');
    const dy=String(d.getDate()).padStart(2,'0');
    datesToTry.push(yr+'-'+mo+'-'+dy);
  }
  dailyDebug='Checking: '+datesToTry.slice(0,3).join(', ');

  function safeFetch(url, ms=8000){
    return new Promise(resolve=>{
      const ctrl=new AbortController();
      const t=setTimeout(()=>{ctrl.abort();resolve(null);},ms);
      fetch(url,{signal:ctrl.signal})
        .then(r=>{ clearTimeout(t); resolve(r); })
        .catch(()=>{ clearTimeout(t); resolve(null); });
    });
  }

  function processBoxscore(bsJ, dateStr){
    const fmtDate=dateStr.slice(5).replace('-','/');
    let found=0;
    // Pull team abbrevs from boxscore itself
    const homeAbbr=bsJ.teams?.home?.team?.abbreviation||'';
    const awayAbbr=bsJ.teams?.away?.team?.abbreviation||'';
    for(const side of ['home','away']){
      const td=bsJ.teams?.[side];
      if(!td) continue;
      const opp=side==='home'?awayAbbr:homeAbbr;
      for(const [,pd] of Object.entries(td.players||{})){
        const fullName=pd.person?.fullName||'';
        if(!myUniqPlayers.some(p=>nameMatch(p,fullName))) continue;
        const n=normName(fullName);
        const pit=pd.stats?.pitching;
        const bat=pd.stats?.batting;
        if(pit&&parseFloat(pit.inningsPitched||0)>0){
          dailyData[n]={name:fullName,group:'pitching',date:dateStr,opp,fmtDate,
            ip:pit.inningsPitched||'0.0',k:+(pit.strikeOuts||0),
            w:+(pit.wins||0),saves:+(pit.saves||0),er:+(pit.earnedRuns||0),h:+(pit.hits||0)};
          found++;
        } else if(bat&&((bat.atBats||0)+(bat.baseOnBalls||0)+(bat.hitByPitch||0))>0){
          dailyData[n]={name:fullName,group:'hitting',date:dateStr,opp,fmtDate,
            ab:+(bat.atBats||0),h:+(bat.hits||0),hr:+(bat.homeRuns||0),
            doubles:+(bat.doubles||0),triples:+(bat.triples||0),runs:+(bat.runs||0),
            rbi:+(bat.rbi||0),sb:+(bat.stolenBases||0),bb:+(bat.baseOnBalls||0)};
          found++;
        }
      }
    }
    return found;
  }

  for(const dateStr of datesToTry){
    try{
      // Step 1: get game PKs - no hydration, just the schedule
      const schedRes=await safeFetch(
        'https://statsapi.mlb.com/api/v1/schedule?sportId=1&date='+dateStr+'&gameType=R',
        8000
      );
      if(!schedRes){dailyDebug+=' | sched null '+dateStr; continue;}
      if(!schedRes.ok){dailyDebug+=' | sched '+schedRes.status+' '+dateStr; continue;}
      const schedJ=await schedRes.json();
      const pks=[];
      for(const do2 of (schedJ.dates||[])){
        for(const g of (do2.games||[])){
          if(g.gamePk) pks.push(g.gamePk);
        }
      }
      dailyDebug+=' | '+dateStr+': '+pks.length+' games';
      if(!pks.length) continue;

      // Step 2: all boxscores in parallel, 8s per request, 18s global cap
      let found=0;
      const fetchAll=Promise.all(pks.map(async pk=>{
        const r=await safeFetch('https://statsapi.mlb.com/api/v1/game/'+pk+'/boxscore',8000);
        if(!r||!r.ok) return;
        const j=await r.json().catch(()=>null);
        if(j) found+=processBoxscore(j,dateStr);
      }));
      await Promise.race([fetchAll, new Promise(res=>setTimeout(res,18000))]);
      dailyDebug+=' found='+found;

      if(found>0){dailyDate=dateStr;break;}
    }catch(e){
      dailyDebug+=' | err:'+e.message;
      continue;
    }
  }

  if(!Object.keys(dailyData).length) dailyError='No data found. Debug: '+dailyDebug;
}

function enableDailyBtn(){
  const b=document.getElementById('daily-rfbtn');
  if(b){b.disabled=false;b.textContent='↻ Refresh';}
}

async function refreshDaily(){
  const b0=document.getElementById('daily-rfbtn');
  if(b0){b0.disabled=true;b0.textContent='↻ Loading...';}

  // Hard safety net: no matter what, re-enable after 30s
  const safetyTimer=setTimeout(()=>{
    try{renderDashboard();}catch(e){}
    enableDailyBtn();
  },30000);

  // Run daily data + stats load in parallel (stats needed for season totals)
  const tasks=[fetchDailyData().catch(e=>console.warn('daily:',e))];
  if(Object.keys(apiData).length===0){
    tasks.push(loadStats().catch(e=>console.warn('stats:',e)));
  }
  await Promise.all(tasks);

  clearTimeout(safetyTimer);
  try{ renderDashboard(); }catch(e){ console.warn('renderDashboard error:',e); }
  enableDailyBtn();
}

function renderDashboard() {
  const all = bets;
  const pending = all.filter(b => b.status === 'pending');
  const wins    = all.filter(b => b.status === 'win');
  const losses  = all.filter(b => b.status === 'loss');

  const totalStaked = all.reduce((a,b)=>a+b.stake,0);
  const maxPayout   = all.reduce((a,b)=>a+b.toWin,0);
  const wonAmt      = wins.reduce((a,b)=>a+b.toWin,0);
  const lostAmt     = losses.reduce((a,b)=>a+b.stake,0);
  const pnl         = wonAmt - lostAmt;
  const pendingExp  = pending.reduce((a,b)=>a+b.stake,0);

  // ── Market exposure ──
  const mktMap = {};
  for (const b of all) {
    if (!mktMap[b.market]) mktMap[b.market] = {stake:0,toWin:0,count:0};
    mktMap[b.market].stake += b.stake;
    mktMap[b.market].toWin += b.toWin;
    mktMap[b.market].count++;
  }
  const topMkts = Object.entries(mktMap).map(([m,v])=>({market:m,...v})).sort((a,b)=>b.stake-a.stake);

  // ── Book exposure ──
  const bookMap = {};
  for (const b of all) {
    if (!bookMap[b.book]) bookMap[b.book]={stake:0,count:0};
    bookMap[b.book].stake+=b.stake; bookMap[b.book].count++;
  }
  const bookArr = Object.entries(bookMap).map(([k,v])=>({book:k,...v})).sort((a,b)=>b.stake-a.stake);
  const bookColors = ['#e8a928','#4f9cf0','#4caf7a','#e05252','#a78bfa','#f472b6','#38bdf8','#fb923c','#a3e635','#94a3b8'];

  // ── Combined bets: group by player+market, merge multi-book ──
  const combinedMap = {};
  for (const b of pending) {
    const key = b.player+'|'+b.market;
    if (!combinedMap[key]) combinedMap[key]={player:b.player,market:b.market,stake:0,toWin:0,books:[],oddsArr:[],inj:isInjured(b.player)};
    combinedMap[key].stake  += b.stake;
    combinedMap[key].toWin  += b.toWin;
    combinedMap[key].books.push(b.book);
    combinedMap[key].oddsArr.push(b.odds);
  }
  const combinedArr = Object.values(combinedMap).sort((a,b)=>b.toWin-a.toWin).slice(0,8);

  // ── Player exposure ──
  const playerMap = {};
  for (const b of all) {
    if (!playerMap[b.player]) playerMap[b.player]={toWin:0,stake:0,count:0};
    playerMap[b.player].toWin+=b.toWin; playerMap[b.player].stake+=b.stake; playerMap[b.player].count++;
  }
  const playerArr = Object.entries(playerMap).map(([p,v])=>({player:p,...v})).sort((a,b)=>b.toWin-a.toWin).slice(0,8);

  // ── Daily summary ──
  const QUANT_HITTING  = new Set(['homeRuns','hits','rbi','doubles','triples','stolenBases','runs']);
  const QUANT_PITCHING = new Set(['wins','strikeouts','saves']);
  function quantCatsForPlayer(name){
    // Only include stat cats for markets that haven't been graded as a loss
    const activeMkts=new Set(bets.filter(b=>nameMatch(b.player,name)&&b.status!=='loss').map(b=>b.market));
    return MY_PICKS.filter(p=>nameMatch(p.player,name)&&activeMkts.size>0).map(p=>p.cat);
  }

  function playerHasActiveBet(name){
    return bets.some(b=>nameMatch(b.player,name)&&b.status!=='loss');
  }

  const dailyEntries = Object.values(dailyData);
  const myPickNames = [...new Set(MY_PICKS.map(p=>normName(p.player)))];

  // Award cats = non-quantifiable markets
  const AWARD_CATS = new Set(['alMVP','nlMVP','alCyYoung','nlCyYoung','alRookie','nlRookie','alManager','nlManager','worldSeries','bestRecord','worstRecord','nextManagerFired']);
  function playerHasAwardBet(name){
    // Only check non-loss bets
    const playerMkts = bets.filter(b=>nameMatch(b.player,name)&&b.status!=='loss').map(b=>b.market.toLowerCase());
    const statLeaderKeywords = ['leader','35+ hr','most wins','most saves'];
    return playerMkts.some(m=>!statLeaderKeywords.some(k=>m.includes(k)));
  }

  const myDaily = dailyEntries.filter(d=>{
    if(!myPickNames.includes(normName(d.name))) return false;
    if(d.group==='pitching'){
      const qc = MY_PICKS.filter(p=>nameMatch(p.player,d.name)).map(p=>p.cat);
      const pitchHasAward = playerHasAwardBet(d.name);
      if(pitchHasAward) return parseFloat(d.ip||0)>0;  // award pitcher: show any outing
      // Pure stat-bet pitcher: only show if they recorded their specific tracked stat
      return (qc.includes('saves')      && d.saves>0)
          || (qc.includes('strikeouts') && d.k>0)
          || (qc.includes('wins')       && d.w>0);
    }

    const qc = MY_PICKS.filter(p=>nameMatch(p.player,d.name)).map(p=>p.cat);
    const hasAward = playerHasAwardBet(d.name);

    if(hasAward){
      // Award guy: show if they got a hit or any notable stat
      return d.h>0||d.hr>0||d.rbi>0||d.sb>0||d.doubles>0;
    } else {
      // Pure stat-bet guy: only show if they recorded one of their specific tracked stats
      return (qc.includes('homeRuns')   &&d.hr>0)
          || (qc.includes('hits')       &&d.h>0)
          || (qc.includes('rbi')        &&d.rbi>0)
          || (qc.includes('stolenBases')&&d.sb>0)
          || (qc.includes('doubles')    &&d.doubles>0)
          || (qc.includes('triples')    &&d.triples>0)
          || (qc.includes('runs')       &&d.runs>0);
    }
  });

  function dailyCard(d){
    const qcats  = quantCatsForPlayer(d.name);
    const isQuant = qcats.length>0 && qcats.some(c=>d.group==='hitting' ? QUANT_HITTING.has(c) : QUANT_PITCHING.has(c));
    const hasAward = playerHasAwardBet(d.name);
    let score='', cls='ok', line='';

    // Helper: get season total for a stat from apiData
    function seasonTotal(catId){
      const r = getRanking(catId, d.name);
      if(r) return r.value;
      const nr = getNRStat(catId, d.name);
      return nr ? nr.value : null;
    }

    // Build a season-total suffix string for multiple tracked stats
    // If only one stat tracked: "(N)" — if multiple: "(N H / N 2B / ...)"
    function totalSuffix(statPairs){ // [{abbr, val}]
      const valid = statPairs.filter(s=>s.val!==null);
      if(!valid.length) return '';
      if(valid.length===1) return ' <span style="color:var(--text3);font-size:11px;">('+valid[0].val+')</span>';
      return ' <span style="color:var(--text3);font-size:11px;">('+valid.map(s=>s.val+' '+s.abbr).join(' / ')+')</span>';
    }

    if(d.group==='hitting'){
      const good = d.hr>0||d.h>=2||d.rbi>=2||d.sb>0;
      const bad  = d.ab>=3&&d.h===0;
      cls   = good?'good':bad?'bad':'ok';
      score = d.h+'-'+d.ab;
      const pts=[];

      // Key rule: season totals only shown for stats that HAPPENED TODAY
      // todayActive = tracked stats that were recorded in this game
      function todayPairs(){
        const p=[];
        if(qcats.includes('hits')        &&d.h>0)      p.push({abbr:'H',  val:seasonTotal('hits'),       today:d.h});
        if(qcats.includes('homeRuns')    &&d.hr>0)     p.push({abbr:'HR', val:seasonTotal('homeRuns'),   today:d.hr});
        if(qcats.includes('rbi')         &&d.rbi>0)    p.push({abbr:'RBI',val:seasonTotal('rbi'),        today:d.rbi});
        if(qcats.includes('stolenBases') &&d.sb>0)     p.push({abbr:'SB', val:seasonTotal('stolenBases'),today:d.sb});
        if(qcats.includes('doubles')     &&d.doubles>0)p.push({abbr:'2B', val:seasonTotal('doubles'),    today:d.doubles});
        if(qcats.includes('triples')     &&d.triples>0)p.push({abbr:'3B', val:seasonTotal('triples'),    today:d.triples});
        if(qcats.includes('runs')        &&d.runs>0)   p.push({abbr:'R',  val:seasonTotal('runs'),       today:d.runs});
        return p;
      }

      const active = todayPairs();

      // H-AB suffix: totals only for tracked stats that happened today
      // If hits is the ONLY active tracked stat → "(total)" no label
      // If multiple active tracked stats → "(total H / total SB)" etc.
      // If no tracked stat happened (e.g. award guy who went 0-fer but showed for award reason) → bare H-AB
      const hitsActive = active.find(p=>p.abbr==='H');
      const otherActive = active.filter(p=>p.abbr!=='H');

      let habSuffix='';
      if(hitsActive&&otherActive.length===0){
        // Only hits: "2-5 (7)"
        habSuffix=hitsActive.val!==null?' <span style="color:var(--text3);font-size:11px;">('+hitsActive.val+')</span>':'';
      } else if(active.length>1){
        // Multiple active tracked stats: "2-5 (7 H / 2 SB)"
        const valid=active.filter(p=>p.val!==null);
        if(valid.length) habSuffix=' <span style="color:var(--text3);font-size:11px;">('+valid.map(p=>p.val+' '+p.abbr).join(' / ')+')</span>';
      }
      // If only non-hit tracked stats happened (e.g. hits not tracked): no suffix on H-AB, totals go inline
      pts.push(d.h+'-'+d.ab+habSuffix);

      // Per-stat breakdown items — for any tracked stat that happened today
      // Don't repeat hits (already in H-AB), and only show other stats if active tracked
      // For award guys: also show notable non-tracked stats (HR, RBI, SB, 2B) without totals
      if(hasAward){
        if(d.hr>0 && !qcats.includes('homeRuns'))   pts.push(d.hr+' HR');
        else if(d.hr>0){ /* already in habSuffix if active */ }
        if(d.rbi>0 && !qcats.includes('rbi'))       pts.push(d.rbi+' RBI');
        if(d.sb>0  && !qcats.includes('stolenBases'))pts.push(d.sb+' SB');
        if(d.doubles>0 && !qcats.includes('doubles'))pts.push(d.doubles+' 2B');
        if(d.triples>0 && !qcats.includes('triples'))pts.push(d.triples+' 3B');
      }
      // For tracked stats other than hits: show as separate items if they happened today
      // (They're already captured in habSuffix combined, but we also want them as standalone items)
      // Only show as separate items if hits was NOT tracked (otherwise combined suffix handles it)
      if(!qcats.includes('hits')){
        for(const p of otherActive){
          pts.push(p.today+' '+p.abbr+(p.val!==null?' <span style="color:var(--text3);font-size:11px;">('+p.val+')</span>':''));
        }
      } else if(active.length<=1){
        // hits IS tracked and nothing else happened → standalone items for non-tracked award stats if any
        // (already handled above in hasAward branch)
      }
      // If hits tracked AND other stats also tracked AND happened: combined suffix on H-AB is enough
      // but still show per-stat items for non-hits tracked stats that happened (e.g. 1 SB separate pill)
      if(qcats.includes('hits') && otherActive.length>0){
        for(const p of otherActive){
          // Already in the combined suffix; skip to avoid duplication
          // Actually: show per-stat item WITHOUT total (total is already in the combined H-AB suffix)
          pts.push(p.today+' '+p.abbr);
        }
      }

      line = pts.join(' · ');

    } else {
      const good = d.w>0||(parseFloat(d.ip)>=6&&d.er<=2);
      const bad  = d.er>=5||parseFloat(d.ip)<3;
      cls   = good?'good':bad?'bad':'ok';
      score = d.ip+' IP';
      const pts=[d.ip+' IP'];
      if(hasAward){
        // Award/Cy Young guy: full line — K only if thrown, total only if tracked and happened
        if(d.k>0){
          const kt=seasonTotal('strikeouts');
          pts.push(d.k+' K'+(kt!==null&&qcats.includes('strikeouts')?' <span style="color:var(--text3);font-size:11px;">('+kt+')</span>':''));
        }
        if(d.w>0) pts.push('W');
        if(d.er>0) pts.push(d.er+' ER');
      } else {
        // Pure stat-bet pitcher: only show tracked stats that happened, with season total
        if(qcats.includes('strikeouts')&&d.k>0){
          const t=seasonTotal('strikeouts');
          pts.push(d.k+' K'+(t!==null?' <span style="color:var(--text3);font-size:11px;">('+t+')</span>':''));
        }
        if(qcats.includes('wins')&&d.w>0){
          const t=seasonTotal('wins');
          pts.push(d.w+' W'+(t!==null?' <span style="color:var(--text3);font-size:11px;">('+t+')</span>':''));
        }
        if(qcats.includes('saves')&&d.saves>0){
          const t=seasonTotal('saves');
          pts.push(d.saves+' SV'+(t!==null?' <span style="color:var(--text3);font-size:11px;">('+t+')</span>':''));
        }
        if(d.er>0) pts.push(d.er+' ER');
      }
      line = pts.join(' · ');
    }

    const injTag  = isInjured(d.name)?'<span class="inj-tag">IL</span>':'';
    // Build opponent string: "@ OPP" or "vs OPP" — we don't know home/away from dailyData alone so use "vs"
    const oppStr  = d.opp ? 'vs '+d.opp : '';
    const dateStr2 = d.fmtDate || '';
    const matchup = [oppStr, dateStr2].filter(Boolean).join(' · ');
    // Bet markets for this player
    const playerBets = bets.filter(b=>nameMatch(b.player,d.name)&&b.status!=='loss');
    const markets = [...new Set(playerBets.map(b=>b.market))];
    const mktStr = markets.join(' · ');
    const dcTeamAbbr = playerTeamAbbr(d.name)||'';
    const dcLogo = dcTeamAbbr ? teamLogoImgTag(dcTeamAbbr,18) : '';
    return '<div class="daily-card '+cls+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">'
        +'<div style="display:flex;align-items:center;gap:7px;min-width:0;">'
          +(dcLogo||'')
          +'<span class="daily-name">'+d.name+injTag+'</span>'
        +'</div>'
        +'<span class="daily-stat '+cls+'" style="flex-shrink:0;">'+score+'</span>'
      +'</div>'
      +'<div style="font-size:10px;color:var(--text3);margin:2px 0 3px;line-height:1.5;">'
        +(matchup?'<span>'+matchup+'</span>':'')
        +(matchup&&mktStr?'<span style="margin:0 4px;opacity:.4">|</span>':'')
        +(mktStr?'<span style="color:var(--blue)">'+mktStr+'</span>':'')
      +'</div>'
      +'<div class="daily-line">'+line+'</div>'
    +'</div>';
  }

  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const ydStr = Object.keys(dailyData).length>0
    ? Object.values(dailyData)[0].date || yesterday.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
    : yesterday.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const dailySection = myDaily.length
    ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">'+myDaily.map(dailyCard).join('')+'</div>'
    : dailyError
      ? '<div style="font-size:12px;color:var(--text3);padding:6px 0;line-height:1.6;">'+dailyError+'</div><div style="font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono);">'+dailyDebug+'</div>'
      : '<div style="font-size:13px;color:var(--text3);padding:8px 0;">Press <b style="color:var(--amber)">↻ Refresh</b> to load recent game data.</div>';

  const html =
    '<div style="margin-bottom:14px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;">'
      +'<div><div style="font-size:22px;font-weight:700;letter-spacing:-.02em;">Season Overview</div>'
      +'<div style="font-size:12px;color:var(--text3);margin-top:3px;">2026 MLB Futures \u00b7 '+all.length+' bets across '+Object.keys(bookMap).length+' books</div></div>'
      +'<div style="font-size:12px;color:var(--text3);">'+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div>'
    +'</div>'

    // Hero metrics
    +'<div class="db-hero">'
      +'<div class="db-hero-card accent"><div class="db-card-label">Max Payout</div><div class="db-big amber">$'+Math.round(maxPayout).toLocaleString()+'</div><div class="db-sub">if all pending hits</div></div>'
      +'<div class="db-hero-card"><div class="db-card-label">Total Staked</div><div class="db-big">$'+Math.round(totalStaked).toLocaleString()+'</div><div class="db-sub">across all bets</div></div>'
      +'<div class="db-hero-card"><div class="db-card-label">Net P&amp;L</div><div class="db-big '+(pnl>=0?'green':'red')+'">'+(pnl>=0?'+':'')+'\$'+Math.abs(Math.round(pnl)).toLocaleString()+'</div><div class="db-sub">'+(pnl>=0?'realized profit':'realized loss')+'</div></div>'
      +'<div class="db-hero-card"><div class="db-card-label">Bet Status</div>'
        +'<div class="status-row">'
          +'<div class="status-pill"><div class="pill-num amber">'+pending.length+'</div><div class="pill-lbl">Pending</div></div>'
          +'<div class="db-divider"></div>'
          +'<div class="status-pill"><div class="pill-num green">'+wins.length+'</div><div class="pill-lbl">Wins</div></div>'
          +'<div class="db-divider"></div>'
          +'<div class="status-pill"><div class="pill-num red">'+losses.length+'</div><div class="pill-lbl">Losses</div></div>'
        +'</div>'
      +'</div>'
    +'</div>'

    // Daily summary
    +'<div class="db-grid" style="margin-bottom:14px;">'
      +'<div class="db-card span12">'
        +'<div class="db-section-title">Recent Performance <span class="db-badge">'+ydStr+'</span><button id="daily-rfbtn" onclick="refreshDaily()" style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--amber);cursor:pointer;font-family:var(--font);">↻ Refresh</button></div>'
        +dailySection
      +'</div>'
    +'</div>'

    // Donut + Market bars
    +'<div class="db-grid" style="margin-bottom:14px;">'
      +'<div class="db-card span4">'
        +'<div class="db-section-title">Stake by Status</div>'
        +'<div class="chart-wrap" style="height:200px;display:flex;align-items:center;justify-content:center;"><canvas id="db-donut"></canvas></div>'
        +'<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text3);">'
          +'<span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--amber);display:inline-block;"></span>Pending $'+Math.round(pendingExp).toLocaleString()+'</span>'
          +'<span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--green);display:inline-block;"></span>Won $'+Math.round(wonAmt).toLocaleString()+'</span>'
          +'<span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--red);display:inline-block;"></span>Lost $'+Math.round(lostAmt).toLocaleString()+'</span>'
        +'</div>'
      +'</div>'
      +'<div class="db-card span8">'
        +'<div class="db-section-title">Amount at Risk by Market <span class="db-badge">'+topMkts.length+' markets</span></div>'
        +'<div class="db-bar-scroll">'
          +topMkts.map(m=>{const pct=(m.stake/totalStaked*100).toFixed(1);return '<div class="db-bar-item"><div class="db-bar-meta"><span class="lbl">'+m.market+'</span><div style="display:flex;gap:10px;align-items:baseline;"><span style="font-size:11px;color:var(--text3);">'+pct+'%</span><span class="amt">$'+m.stake.toFixed(2)+'</span></div></div><div class="db-bar-track"><div class="db-bar-fill" style="width:'+Math.round(m.stake/topMkts[0].stake*100)+'%"></div></div></div>';}).join('')
        +'</div>'
      +'</div>'
    +'</div>'

    // Combined top bets + player exposure + books
    +'<div class="db-grid">'
      +'<div class="db-card span6">'
        +'<div class="db-section-title">Biggest Pending Bets <span class="db-badge">combined lines</span></div>'
        +'<div class="odds-grid">'
          +combinedArr.map(b=>{
            const avgOd = avgOdds(b.oddsArr);
            const injTag = b.inj?'<span class="inj-tag" style="font-size:9px;margin-left:4px">IL</span>':'';
            const multiBook = b.books.length>1?' <span style="font-size:10px;color:var(--text3);">('+b.books.length+' books)</span>':'';
            return '<div class="odds-item">'
              +'<div class="o-player">'+b.player+injTag+'</div>'
              +'<div class="o-market">'+b.market+multiBook+'</div>'
              +'<div><span class="o-win">$'+Math.round(b.toWin).toLocaleString()+'</span><span class="o-odds">'+avgOd+'</span></div>'
              +'<div style="font-size:10px;color:var(--text3);margin-top:2px;">staked $'+b.stake.toFixed(2)+'</div>'
            +'</div>';
          }).join('')
        +'</div>'
      +'</div>'
      +'<div class="db-card span3">'
        +'<div class="db-section-title">Player Exposure <span class="db-badge">to win</span></div>'
        +'<ul class="db-list">'
          +playerArr.map((p,i)=>{
            const inj=isInjured(p.player);
            const injTag=inj?'<span class="inj-tag" style="font-size:9px;">IL</span>':'';
            const dbTeamAbbr=playerTeamAbbr(p.player)||'';
            const dbLogo=dbTeamAbbr?teamLogoImgTag(dbTeamAbbr,15):'';
            return '<li>'
              +'<span style="font-size:11px;color:var(--text3);width:16px;flex-shrink:0;">'+(i+1)+'</span>'
              +(dbLogo||'<span style="width:15px;flex-shrink:0;"></span>')
              +'<span class="name">'+p.player+injTag+'</span>'
              +'<span class="sub2">'+p.count+' bet'+(p.count>1?'s':'')+'</span>'
              +'<span class="val">$'+Math.round(p.toWin).toLocaleString()+'</span>'
            +'</li>';
          }).join('')
        +'</ul>'
      +'</div>'
      +'<div class="db-card span3">'
        +'<div class="db-section-title">Book Exposure <span class="db-badge">staked</span></div>'
        +'<ul class="db-list">'
          +bookArr.map((b,i)=>'<li>'
            +'<span class="book-dot" style="background:'+bookColors[i%bookColors.length]+'"></span>'
            +'<span class="name">'+b.book+'</span>'
            +'<span class="sub2">'+b.count+'</span>'
            +'<span class="val">$'+b.stake.toFixed(2)+'</span>'
          +'</li>').join('')
        +'</ul>'
      +'</div>'
    +'</div>';

  const el = document.getElementById('db-content');
  el.innerHTML = html;

  destroyChart('db-donut');
  const ctx = document.getElementById('db-donut');
  if (ctx) {
    chartInstances['db-donut'] = new Chart(ctx, {
      type:'doughnut',
      data:{
        labels:['Pending','Won','Lost'],
        datasets:[{
          data:[Math.round(pendingExp*100)/100, Math.round(wonAmt*100)/100, Math.round(lostAmt*100)/100],
          backgroundColor:['#e8a928','#4caf7a','#e05252'],
          borderColor:'#181818', borderWidth:3, hoverOffset:6
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'72%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' $'+ctx.parsed.toLocaleString()}}}
      }
    });
  }
}

function playerTeamAbbr(name){
  const n = normName(name);
  // 0. Hard overrides (beats API — check both exact and partial name match)
  if(TEAM_OVERRIDES[n]) return TEAM_OVERRIDES[n];
  // Also check if any override key is contained in n (handles 'William Benson' vs 'Will Benson')
  for(const [k,v] of Object.entries(TEAM_OVERRIDES)){
    if(n.includes(k)||k.includes(n)) return v;
  }
  // 1. Live API data
  for(const cat of Object.values(apiData)){
    const found = cat.find(l=>nameMatch(l.name,name));
    if(found && found.team && found.team!=='—') return found.team;
  }
  // 2. NR player stats cache
  for(const cat of Object.values(playerStatsCache)){
    if(cat[n] && cat[n].team && cat[n].team!=='—') return cat[n].team;
  }
  // 3. Hardcoded fallback
  return PLAYER_TEAM_MAP[n] || null;
}

// Preload all logos via fetch → blob URL so browser loads them once cleanly
function preloadLogos(){
  // Preload by creating offscreen img elements — no CORS needed for img tags
  // On load success, cache the src; on failure, try next in chain
  Object.keys(LOGO_SOURCES).forEach(abbr=>{
    const urls = LOGO_SOURCES[abbr]||[];
    if(!urls.length) return;
    let idx=0;
    function tryNext(){
      if(idx>=urls.length) return;
      const img = new Image();
      img.onload = function(){
        LOGO_CACHE[abbr]=urls[idx]; // SVGs always have naturalWidth=0, cache regardless
      };
      img.onerror = function(){
        idx++;
        tryNext();
      };
      img.src = urls[idx];
    }
    tryNext();
  });
  // Re-render after logos load — covers all tabs
  setTimeout(()=>{
    renderDashboard();
    const sc=document.getElementById('stat-content'); if(sc&&sc.innerHTML) renderStats();
    const recEl=document.getElementById('stat-content');
    if(recEl&&activeStatTab==='records') renderStats();
  }, 2000);
}

window.mlbImgErr = function(el){
  var f1=el.getAttribute('data-fb1'),f2=el.getAttribute('data-fb2'),f3=el.getAttribute('data-fb3');
  var cur=el.src;
  if(f1&&cur.indexOf(f1)<0){el.src=f1;return;}
  if(f2&&cur.indexOf(f2)<0){el.src=f2;return;}
  if(f3&&cur.indexOf(f3)<0){el.src=f3;return;}
  el.style.display='none';
  var b=el.nextElementSibling;
  if(b&&b.className&&b.className.indexOf('team-badge')>=0)b.style.display='inline-block';
};

function teamLogoUrl(abbr){
  const id = MLB_TEAM_IDS[abbr];
  return id ? 'https://www.mlbstatic.com/team-logos/'+id+'.svg' : '';
}

function teamLogoImgTag(abbr, size){
  const s    = size||18;
  const bg   = TEAM_COLORS_MAP[abbr]||'#444';
  const label= abbr||'?';
  const fs   = label.length>2 ? Math.round(s*0.33) : Math.round(s*0.38);
  const srcs = LOGO_SOURCES[abbr]||[];
  if(!srcs.length) return '<span style="width:'+s+'px;display:inline-block;flex-shrink:0;"></span>';

  // Use preloaded blob URL if available, otherwise use first CDN URL with fallback chain
  const cached = LOGO_CACHE[abbr];
  const primarySrc = cached || srcs[0];
  const fb1 = (!cached && srcs[1]) ? srcs[1] : '';
  const fb2 = (!cached && srcs[2]) ? srcs[2] : '';

  const badge = '<span class="team-badge" style="display:none;width:'+s+'px;height:'+s+'px;'
    +'background:'+bg+';border-radius:3px;vertical-align:middle;flex-shrink:0;'
    +'font-size:'+fs+'px;font-weight:700;color:#fff;text-align:center;line-height:'+s+'px;'
    +'font-family:Arial,sans-serif;">'+label+'</span>';

  return '<img data-fb1="'+fb1+'" data-fb2="'+fb2+'"'
    +' onerror="mlbImgErr(this)"'
    +' src="'+primarySrc+'"'
    +' style="width:'+s+'px;height:'+s+'px;object-fit:contain;vertical-align:middle;flex-shrink:0;"'
    +' alt="'+abbr+'">'+badge;
}

function playerLogoImg(name, size){
  const abbr = playerTeamAbbr(name);
  if(!abbr) return '';
  return teamLogoImgTag(abbr, size||18);
}

function buildTickerGame(g){
  const away = g.teams?.away;
  const home = g.teams?.home;
  if(!away||!home) return '';

  const awayAbbr = away.team?.abbreviation||'?';
  const homeAbbr = home.team?.abbreviation||'?';
  const awayScore = away.score ?? '—';
  const homeScore = home.score ?? '—';
  const status = g.status?.detailedState||'';
  const abstractState = g.status?.abstractGameState||'';
  const inning = g.linescore?.currentInningOrdinal||'';
  const isLive = abstractState==='Live';
  const isFinal = abstractState==='Final';
  const isPreview = abstractState==='Preview';

  let statusTxt, statusCls='';
  if(isLive){
    const half = g.linescore?.inningHalf||'';
    statusTxt = (half==='Top'?'▲':'▼')+' '+inning;
    statusCls = 'live';
  } else if(isFinal){
    statusTxt = 'Final'+(g.linescore?.currentInning&&g.linescore.currentInning!==9?' /'+g.linescore.currentInning:'');
  } else {
    // Preview — show game time
    const gt = g.gameDate ? new Date(g.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : 'TBD';
    statusTxt = gt;
  }

  const awayWin = isFinal && awayScore > homeScore;
  const homeWin = isFinal && homeScore > awayScore;
  const awayLogo = teamLogoUrl(awayAbbr);
  const homeLogo = teamLogoUrl(homeAbbr);

  return '<div class="ticker-game">'
    +'<div class="ticker-team">'
      +(awayLogo?'<img class="ticker-logo" src="'+awayLogo+'" alt="'+awayAbbr+'">':'')
      +'<span class="ticker-abbr">'+awayAbbr+'</span>'
    +'</div>'
    +'<div class="ticker-score-wrap">'
      +'<div class="ticker-scores">'
        +'<span class="'+(awayWin?'winner':'')+'">'+awayScore+'</span>'
        +'<span class="ticker-dash">-</span>'
        +'<span class="'+(homeWin?'winner':'')+'">'+homeScore+'</span>'
      +'</div>'
      +'<div class="ticker-status '+statusCls+'">'+statusTxt+'</div>'
    +'</div>'
    +'<div class="ticker-team">'
      +(homeLogo?'<img class="ticker-logo" src="'+homeLogo+'" alt="'+homeAbbr+'">':'')
      +'<span class="ticker-abbr">'+homeAbbr+'</span>'
    +'</div>'
  +'</div>';
}

async function loadScores(){
  const inner = document.getElementById('ticker-inner');
  if(!inner) return;

  try{
    const today = new Date();
    const yr = today.getFullYear();
    const mo = String(today.getMonth()+1).padStart(2,'0');
    const dy = String(today.getDate()).padStart(2,'0');
    const dateStr = yr+'-'+mo+'-'+dy;

    const res = await fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date='+dateStr+'&gameType=R&hydrate=linescore,team');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();

    const games = [];
    for(const d of (j.dates||[])){
      for(const g of (d.games||[])) games.push(g);
    }

    if(!games.length){
      inner.innerHTML='<span class="ticker-loading">No games scheduled today</span>';
      return;
    }

    // Sort: live first, then final, then upcoming
    games.sort((a,b)=>{
      const order = s => s==='Live'?0:s==='Final'?1:2;
      return order(a.status?.abstractGameState) - order(b.status?.abstractGameState);
    });

    const html = games.map(buildTickerGame).join('');
    // Duplicate for seamless loop
    inner.innerHTML = html + html;

    // Adjust animation speed based on number of games
    const speed = Math.max(12, games.length * 2);
    inner.style.animationDuration = speed+'s';
    if(tickerPaused) inner.classList.add('paused');

  }catch(e){
    if(inner) inner.innerHTML='<span class="ticker-loading">Scores unavailable</span>';
  }

  // Auto-refresh every 60s for live games
  clearTimeout(tickerRefreshTimer);
  tickerRefreshTimer = setTimeout(loadScores, 60000);
}

preloadLogos();
